name: ute-dual-c01
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ute_dual_c01
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/setup-local.ps1}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Ejecuta scripts/setup-local.ps1}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-ute-dual.sh:ro
      - ./database/schema_dual_desde_cero.sql:/opt/ute/schema.sql:ro
      - ./database/migrations:/opt/ute/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ute_dual_c01"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: &api-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ute_dual_c01
      DB_USER: ute_dual_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Ejecuta scripts/setup-local.ps1}
      SECRET_KEY: ${SECRET_KEY:?Ejecuta scripts/setup-local.ps1}
      C01_LOCAL_COMPOSE: "true"
      # C10A: los archivos viven en Drive (decisión del 2026-10-17). `local` solo para desarrollo y regresión.
      ALMACENAMIENTO: ${ALMACENAMIENTO:-drive}
      DRIVE_CARPETA_ID: ${DRIVE_CARPETA_ID:-}
      DRIVE_TOKEN_FILE: /secretos/drive_token.json
      FRONTEND_URL: http://127.0.0.1:${WEB_PORT:-5174}
      CORS_ORIGINS: http://127.0.0.1:${WEB_PORT:-5174},http://localhost:${WEB_PORT:-5174}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      # Credenciales de Drive (solo lectura, fuera de git). El volumen de uploads solo se usa con ALMACENAMIENTO=local.
      - ./.secretos:/secretos:ro
      - dual-uploads:/workspace/ute-api-backend/uploads/dual
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:${API_PORT:-8001}
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  smoke:
    profiles: ["verification"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-environment
      API_URL: http://api:8000
    volumes:
      # Mismo volumen que la API: el smoke comprueba hashes y limpia huérfanos reales (modo local).
      - ./.secretos:/secretos:ro
      - dual-uploads:/workspace/ute-api-backend/uploads/dual
    command: ["python", "scripts/smoke_c01.py"]
    depends_on:
      api:
        condition: service_healthy

  # C10: respaldo y restauración (DP-11). Los respaldos viven en el espacio `respaldos` de Drive; el volcado de la base
  # pasa por una carpeta temporal del equipo (`.respaldo-tmp`, ignorada por git) que scripts/respaldo.ps1 vacía al terminar.
  respaldo:
    profiles: ["respaldo"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-environment
      RESPALDO_ORIGEN_CARPETA: ${RESPALDO_ORIGEN_CARPETA:-}
      # C13: clave PÚBLICA de age (la privada nunca entra al contenedor salvo la copia temporal de restaurar.ps1) y entorno de restauración.
      RESPALDO_CLAVE_PUBLICA: ${RESPALDO_CLAVE_PUBLICA:-}
      RESPALDO_ENTORNO: ${RESPALDO_ENTORNO:-}
      RESPALDO_TMP: /tmp/respaldo
      API_URL: http://api:8000
    volumes:
      - ./.secretos:/secretos:ro
      - ./.respaldo-tmp:/tmp/respaldo
    depends_on:
      postgres:
        condition: service_healthy

  # C10A: autoriza Drive con la cuenta de pruebas (OAuth de usuario, alcance drive.file) y crea la carpeta raíz.
  # Uso: docker compose --profile drive run --rm --service-ports drive-autorizar
  drive-autorizar:
    profiles: ["drive"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ALMACENAMIENTO: drive
      DRIVE_TOKEN_FILE: /secretos/drive_token.json
      DRIVE_CLIENTE_FILE: /secretos/client_secret.json
    volumes:
      - ./.secretos:/secretos
    ports:
      - "127.0.0.1:8085:8085"
    command: ["python", "scripts/autorizar_drive.py"]

volumes:
  postgres-data:
  dual-uploads:
